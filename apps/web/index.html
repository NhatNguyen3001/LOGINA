<!doctype html>
<html lang="en" translate="no" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LOGINA has its own English and Vietnamese. Browser translation rewrites the page under React and crashes it. -->
    <meta name="google" content="notranslate" />
    <title>LOGINA</title>
    <!-- Applies a saved theme before the first paint, so a dark choice never flashes light. Same rule as src/lib/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('logina.theme');
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
        else if (theme === 'system') delete document.documentElement.dataset.theme;
      } catch (error) {}
    </script>
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
